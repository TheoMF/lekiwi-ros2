controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lekiwi_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lekiwi_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Add individual wheel controllers (velocity control)
    lekiwi_wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

lekiwi_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll

    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    # Prevent movement on startup
    start_position_control: false
    hold_position_on_startup: false
    allow_nonzero_velocity_at_trajectory_start: false
    cmd_timeout: 2.0
    constraints:
      stopped_velocity_tolerance: 0.002

lekiwi_gripper_controller:
  ros__parameters:
    joints:
      - gripper
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    # Add this to prevent movement on startup
    start_position_control: false
    hold_position_on_startup: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# New wheel controller configuration (velocity control)
lekiwi_wheel_controller:
  ros__parameters:
    joints:
      - left_wheel_drive
      - rear_wheel_drive
      - right_wheel_drive
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    start_position_control: false
    hold_position_on_startup: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
